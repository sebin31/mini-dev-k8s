name: Deploy to Minikube

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: kubectl apply -f api-deployment.yaml -f api-service.yaml -f db-deployment.yaml -f db-service.yaml -f frontend-deployment.yaml -f frontend-service.yaml -f nginx-deployment.yaml -f nginx-configmap.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api --timeout=90s
          kubectl rollout status deployment/frontend --timeout=90s
          kubectl rollout status deployment/nginx --timeout=90s

      - name: Health check
        run: |
          kubectl run healthcheck-temp --image=curlimages/curl --rm -i --restart=Never -- curl -fsS http://nginx/health